name: Build

on:
  push:
    branches: [master, v2-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build against Spigot API ${{ matrix.spigot-api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.21 is the oldest supported API; 26.3 the newest. The jar must build against both.
        spigot-api: ["1.21-R0.1-SNAPSHOT", "26.3-R0.1-SNAPSHOT"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon -PspigotApi=${{ matrix.spigot-api }}

      - name: Upload plugin jar
        if: matrix.spigot-api == '1.21-R0.1-SNAPSHOT'
        uses: actions/upload-artifact@v4
        with:
          name: BiblePlugin
          path: bibleplugin-spigot/build/libs/BiblePlugin-*.jar
